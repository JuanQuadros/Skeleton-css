<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
    <title>Skeleton CSS</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="six columns offset-by-three">
                <h2>Formulário</h2>
                <label for="nome">Nome</label>
                <input type="text" class="u-full-width">
                <label for="email"Email>Email</label>
                <input type="email" class="u-full-width">

                <button class="button-primary u-full-width">Cadastrar</button>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="six columns offset-by-three">
                <h2>Cadastros</h2>
                <table>
                    <thead>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Matrícula</th>
                    </thead>
                    <tbody>
                        <td>Maria</td>
                        <td>18</td>
                        <td>763211</td>
                    </tbody>
                    <tbody>
                        <td>Joao</td>
                        <td>20</td>
                        <td>123322</td>
                    </tbody>
                    <tbody>
                        <td>Vitor</td>
                        <td>19</td>
                        <td>433322</td>
                    </tbody>
                </table>
            </div>
        </div>
        <hr>
        <button class="button">Cancelar</button>
        <button class="button-primary">Enviar</button>
        <button type="button" class="btn btn-xs preset-filled">Button</button>
        
    </div>
</body>
</html>
